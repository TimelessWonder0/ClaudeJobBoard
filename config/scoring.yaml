# The 100-point score for board/score.py. Edit freely; no code change needed. Pure Python, no Claude, no web lookups.
#
#   role fit        35   Track A or B 35, Track C 25, Track D (any other finance role) 25
#   level fit       20   0-3 years required 20, 4 years 12, unstated but clearly analyst level 15
#   skills overlap  15   3 points per skill group found in the JD, max 15
#   training signal 15   rotational / development program +8, mentorship / training +4, career ladder +3, cap 15
#   future-facing   10   future 10, adjacent 6, traditional 2 (sector_tier in companies.yaml)
#   location         5   California 5, Washington or New York 4, other target metro 3
#
# Company size and market cap are NOT used anywhere: not to filter, not to score.

points:
  role_fit: 35
  level_fit: 20
  skills: 15
  training: 15
  future_facing: 10
  location: 5

# Tiers. A role below min_score is kept out of the Board and listed in Hidden ("score below 50") so it can be overridden.
tiers: {apply_now: 75, strong: 60, stretch: 50}
min_score: 50

# --- role fit: tracks, first match wins ----------------------------------------------------------------
# The Board "Track" column shows the track name. `points` is the role-fit score; `letter` is the skill's track letter.
tracks:
  # Investment banking analyst roles stay on the board but are Track D (25 role-fit points), never A or B. Listed first so it wins.
  - {name: Investment Banking, letter: D, points: 25, patterns: ['restructuring', 'm&a\b', 'mergers', 'investment banking', 'coverage (?:analyst|associate)', 'leveraged finance', 'special situations', 'capital markets']}
  - {name: FP&A,            letter: A, points: 35, patterns: ['fp&a', '\bfpa\b', 'financial planning', 'finance business partner']}
  - {name: Strategic Finance, letter: B, points: 35, patterns: ['strategic finance', 'business finance', 'product finance', 'biz ?ops.*financ', 'financ.*biz ?ops']}
  - {name: Pricing,           letter: C, points: 25, patterns: ['pricing', 'deals? desk', 'deal finance', 'revenue analyst']}
  - {name: Corporate Finance, letter: D, points: 25, patterns: ['corporate finance', 'corporate development', 'treasur', 'investor relations']}
  - {name: Equity Research,   letter: D, points: 25, patterns: ['equity research', 'equity analyst', 'research associate', 'investment analyst']}
track_default: {name: Financial Analyst, letter: D, points: 25}

# --- level fit ----------------------------------------------------------------------------------------
# Required years -> points: 0-2 years 20, exactly 3 years 14, 4 years 8. A Senior / Sr title (kept only up to 4 years by the
# filter) loses senior_penalty more points, never going below 0.
level_table:
  - {max_years: 2, points: 20}
  - {max_years: 3, points: 14}
  - {max_years: 4, points: 8}
level_unstated_points: 15          # years not stated but the title is analyst level (every row that reaches scoring is)
senior_penalty: 5

# --- skills overlap: 3 points per group found, max `points.skills` ------------------------------------
skill_points_each: 3
skills:
  - {name: forecasting,         terms: ['forecast', 'budgeting', 'long[- ]range plan', 'annual operating plan']}
  - {name: variance_scenario,   terms: ['variance', 'scenario', 'sensitivity', 'flux analysis', 'bridge analysis']}
  - {name: modeling,            terms: ['financial model', 'driver[- ]based', 'three[- ]statement', '3[- ]statement', 'valuation model', '\bdcf\b']}
  - {name: cross_functional,    terms: ['cross[- ]functional', 'business partner', 'stakeholder', 'partner with']}
  - {name: sql_python,          terms: ['\bsql\b', '\bpython\b', '\bvba\b', 'power query']}
  - {name: automation_ai,       terms: ['automat', '\bAI\b', 'machine learning', 'streamlin']}

# --- training signal: patterns on the JD text (and title), case-insensitive regexes ------------------
# A group scores once however many of its patterns match. Total is capped at `points.training`.
# The first matching phrase of each group is shown on the board as "Training: <phrase>".
training_signal:
  - name: program
    points: 8
    patterns:
      - 'rotational (?:program|programme|analyst|development)'
      - 'rotation(?:al)? program'
      - 'leadership (?:development )?program'
      - 'development program'
      - 'analyst program'
      - '\banalyst i\b'
      - 'new[- ]grad(?:uate)?'
      - 'recent graduate'
      - 'early[- ]career'
      - 'entry[- ]level'
      - '0\s*[-–]\s*2\s*years'
      - 'graduate program'
  - name: mentorship
    points: 4
    patterns:
      - 'mentorship|mentoring|mentor\b'
      - 'structured training'
      - 'we will train|we.ll train|will be trained|training program|on[- ]the[- ]job training'
      - 'coaching'
      - 'career development|professional development'
      - 'eager to learn|opportunity to learn|learn(?:ing)? (?:and|&) grow|learn from'
  - name: ladder
    points: 3
    patterns:
      - 'analyst i/ii|analyst i,? ii|analyst i or ii|analyst i and ii|analyst i-ii'
      - 'path to senior|path to (?:a )?senior|growth path|promotion path|career (?:ladder|path|progression)'
      - 'promot(?:e|ed|ion) to (?:senior|analyst ii)'
future_tier_points: {future: 10, adjacent: 6, traditional: 2}
future_tier_unknown_points: 4           # company not found in companies.yaml

# --- location points by metro key (filters.yaml); unknown location gets location_unknown_points ----
location_points:
  bay_area: 5
  los_angeles: 5
  san_diego: 5
  seattle: 4
  new_york: 4
default_location_points: 3
location_unknown_points: 2

# --- keyword groups for /apply (not scored) ----------------------------------------------------------
# /apply and GapCheck.md split the JD's skill words into ones the candidate file supports (mirror them) and ones it does not.
keyword_groups:
  - {name: forecasting,            terms: ['forecast', 'budgeting', 'long[- ]range plan', 'lrp', 'annual operating plan']}
  - {name: pricing,                terms: ['pricing', 'deal desk', 'cost estimat', 'cost proposal', 'rate model', 'unit economics']}
  - {name: variance_scenario,      terms: ['variance', 'scenario', 'sensitivity', 'bridge analysis', 'flux']}
  - {name: excel_vba,              terms: ['excel', 'vba', 'power query', 'pivot', 'xlookup', 'macros']}
  - {name: sql,                    terms: ['\bsql\b']}
  - {name: python,                 terms: ['\bpython\b']}
  - {name: dcf_valuation,          terms: ['\bdcf\b', 'discounted cash flow', 'valuation', 'comps\b', 'comparable compan']}
  - {name: pnl,                    terms: ['p&l', 'p & l', 'profit and loss', 'income statement', 'margin analysis', 'financial statements']}
  - {name: modeling,               terms: ['financial model', 'driver[- ]based', 'three[- ]statement', '3[- ]statement']}
  - {name: bi_tools,               terms: ['power bi', 'tableau', 'looker']}
  - {name: stakeholder_partnering, terms: ['business partner', 'cross[- ]functional', 'stakeholder']}

# --- company aliases ---------------------------------------------------------------------------------
# Substring (case/punctuation-insensitive) in the company name -> name in companies.yaml.
company_aliases:
  youtube: Google
  deepmind: Google
  "amazon.com services": Amazon
  "amazon web services": Amazon
  fmr: Fidelity
