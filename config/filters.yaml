    cities: [San Jose, San Francisco, Oakland, Palo Alto, Mountain View, Sunnyvale, Santa Clara, Cupertino, Menlo Park, Redwood City, San Mateo, Fremont, Berkeley, Milpitas, Pleasanton, Foster City, South San Francisco, San Bruno, Los Gatos, Campbell, San Carlos, Burlingame, Emeryville, Walnut Creek, Los Altos, Bay Area, SF, Silicon Valley, San Rafael, Daly City, Livermore, Petaluma, Bay Point, "Brisbane, CA", "Dublin, CA", CA-Dublin, "Union City, CA", "Newark, CA", Hayward, San Leandro, San Ramon, Alameda, "Belmont, CA", Saratoga, Morgan Hill, Mill Valley, Sausalito, Novato, Mission Bay]
  seattle:
    label: Seattle
    cities: [Seattle, Bellevue, Redmond, Kirkland]
  austin:
    label: Austin
    cities: [Austin, Round Rock]
  chicago:
    label: Chicago
    cities: [Chicago]
  new_york:
    label: New York
    cities: [New York, NYC, Manhattan, Brooklyn]
  boston:
    label: Boston
    cities: [Boston, "Cambridge, MA", Waltham]
  miami:
    label: Miami
    cities: [Miami]
  hawaii:
    label: Hawaii
    cities: [Honolulu, Hawaii]
  dallas:
    label: Dallas
    cities: [Dallas, Fort Worth, Irving, Plano, Frisco, Richardson, Addison]
  denver:
    label: Denver
    cities: [Denver, Boulder, Englewood, Greenwood Village, Broomfield]
