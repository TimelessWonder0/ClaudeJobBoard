# Hard filters and metro map for board/filters.py. Rules mirror CLAUDE.md.
# Anything ambiguous is flagged, never hidden.

# THE posting window, in days, measured from run start in America/Chicago. Every filter, score and scan reads this one value.
days: 4

# Years of experience. Hide when the minimum REQUIRED years is above max_required_years (so 4 or more is hidden).
# A requirement equal to this number is kept and flagged "stretch". The figure used is the one that applies to
# you: with "Bachelor's + 4 or Master's + 2" it is 4, because you hold no Master's. Preferred years never hide.
senior_max_required_years: 4   # a Senior / Sr title is kept only when the minimum required years is this or fewer (decided in the JD stage)
max_required_years: 3
min_confidence_to_hide: medium # low | medium | high. Years/degree evidence below this only flags.

# Licenses. Hidden only when required BEFORE hire. Licenses a JD says you can obtain after hire (and any
# Series 86/87, SIE, 79, which research roles normally sponsor) are kept with a flag.
hide_licenses_before_hire: ['Series 7', 'Series 63', 'Series 65', 'Series 66']
# Degrees / credentials that hide a role when REQUIRED (preferred only flags).
hide_degrees_required: [masters, mba, phd]
hide_certs_required: [CFA, CPA]

# New-grad programs ("University Graduate", "New Grad", "Early Career") are kept unless the JD's graduation
# window clearly excludes this graduation date.
graduation_date: 2024-12-01
newgrad_title_patterns: ['university graduate', 'new grad', 'early career', 'graduate program', 'campus']

# Senior / managerial titles: HIDDEN. Case-insensitive regexes (the Roman-numeral rule is case-sensitive: III and above).
hide_title_patterns:
  - '\blead\b'
  - '\bprincipal\b'
  - '\bstaff\b'
  - 'director'
  - 'manager'
  - 'vice president'
  - '\bvp\b'
  - '\bhead\b'
  - '\bintern(s|ship)?\b'
hide_title_roman_levels: '(?:^|[\s,(-])(?:III|IV|V|VI|VII|VIII|IX|X)(?=$|[\s,):-])'
# Titles to flag (kept, not hidden).
flag_title_patterns:
  - '\bassociate\b'            # at banks usually post-MBA; the years/degree rules decide

# Allow-list of finance-role titles. A title must match one of these in its first segment (before the first
# " - ", ",", or "(") to be shown; "Account Executive, Corporate Finance" and "Business Intelligence Analyst - Corporate
# Finance" fail because the role noun is not a finance role. Anything not on the list is hidden as off-track.
allowed_title_patterns:
  - 'financial analyst'
  - 'finance analyst'
  - 'fp&a'
  - '\bfpa\b'
  - 'financial planning'
  - 'business finance'
  - 'product finance'
  - 'strategic finance'
  - 'corporate finance'
  - 'finance associate'
  - '(finance|financial) (rotation|development|leadership development)'
  - 'pricing analyst'
  - 'pricing finance'
  - 'deals? desk'
  - 'deal finance'
  - 'revenue analyst'
  - 'cost analyst'
  - 'equity research'
  - 'research associate'
  - 'equity analyst'
  - 'investment analyst'
  - 'investment bank|banking (analyst|associate)'
  - 'private equity|venture capital|growth equity'
  - 'coverage (analyst|associate)|investment banking'
  - 'lending (analyst|associate)'
  - 'portfolio (analyst|associate)|asset management (analyst|associate)|wealth (analyst|associate)'
  - 'capital markets|fixed income|leveraged finance|restructuring|syndicat'
  - 'sales (and|&) trading|trading analyst|securities analyst|treasury analyst'
  - 'corporate development|m&a|mergers'
  - 'investor relations|risk analyst|economist'
# Combo rule: a title with "analyst" or "associate" (business analyst included) that is not on the list above still passes when it
# also names one of finance_words, unless it matches exclude (off-track kinds of analyst). Bare analyst / associate titles fail.
analyst_combo:
  roles: '\b(?:analyst|associate)\b'
  finance_words: 'financ|fp&a|\bfpa\b|planning|pricing|treasur|revenue|capital|corporate development|strategy (?:&|and) finance|valuation|investor relations'
  exclude: 'business intelligence|\bBI\b|\bdata\b|\bsystems?\b|software|marketing|\bsales\b|human resources|\bHR\b|design|supply chain'
# A bare first segment such as "Analyst, FP&A" is judged by the rest of the title.
generic_title_heads: ['^(?:associate )?analyst$', '^associate$', '^specialist$', '^research analyst$']

# Quant: title match hides. JD match hides only for the strong phrases.
quant_title_patterns: ['\bquant', 'quantitative (research|trad|develop|analyst|strateg)']
quant_jd_strong_patterns:
  - 'quantitative (researcher|trader|developer|strategist)'
  - '\bquant (researcher|trader|developer|analyst)'
  - 'systematic trading'
  - 'alpha research'
  - 'stochastic calculus'
quant_jd_flag_patterns: ['quantitative (research|modeling|modelling|finance|strateg|analyst)']

# Location strings that carry no city. Shown with a "location unknown" flag.
generic_location_patterns:
  - '^\s*$'
  - '^(united states|usa|u\.s\.a?\.?|us)\s*$'
  - 'multiple locations?'
  - '^\d+ locations?$'
  - 'various'
  - '^n/?a$'
  - 'flexible'
  - 'anywhere'

# Metro map. A job passes the metro rule when its location text contains any city token.
metros:
  bay_area:
