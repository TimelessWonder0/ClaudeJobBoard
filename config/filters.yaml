# ---- Rules from the finance-job-scout skill, now run in Python ----------------------------------------------------------

# Per-board time limit for the fetch. A board that runs past it is cut off, keeps what it already listed, and is reported as "partial".
fetch:
  board_time_limit_seconds: 180
  workers: 8
  workday_concurrency: 4          # requests in flight across ALL *.myworkdayjobs.com hosts combined
  workday_delay_seconds: 0.3      # pause inside each Workday slot after a request, so the combined rate stays polite
  rate_limit_cooldown_seconds: 60 # boards that still got HTTP 429 after their retries are tried once more after this pause
  # Server-side search queries for SmartRecruiters, Amazon, Eightfold and Oracle (merged, deduped by job id).
  # Greenhouse, Lever and Ashby return the whole board in one call, so they need none. `--full` ignores these and pulls everything.
  keywords: [finance, financial analyst, FP&A, pricing, treasury, corporate development, investor relations, equity research, investment, strategic finance]
  # Workday searches page 20 at a time through a shared limit, so its list is narrower: no bare "finance" or "investment".
  workday_keywords: [financial analyst, FP&A, FP&A analyst, financial planning, pricing, treasury, corporate development, investor relations, equity research, strategic finance]
  # Workday Finance facet (python -m board workday-facets caches the ids in companies.yaml as workday_facet). A tenant with a
  # finance category is queried with that facet and no search text; a tenant with none uses the short fallback list below.
  workday_facet_pattern: 'financ|treasur|fp&a|corporate development|investor relations|equity research|capital markets|investment banking|pricing'
  workday_facet_exclude: 'crime|advis|sales|insurance|non-financial|financial (?:center|services|technology|risk|reporting)|branch|client facing|inactive|actuarial'
  workday_fallback_keywords: [financial analyst, FP&A, treasury, pricing]

# Staffing agencies and recruiter reposts. Matched against the company name; the JD phrases against the description.
staffing_agencies: [Robert Half, Insight Global, TEKsystems, Randstad, Kforce, Aerotek, Apex Systems, Beacon Hill, Hays, Michael Page, Vaco,
  Creative Financial Staffing, Adecco, Manpower, ManpowerGroup, Experis, Accountemps, Robert Walters, Motion Recruitment, Jobot, CyberCoders, Collabera, Judge Group]
staffing_jd_patterns:
  - 'on behalf of our client'
  - '\bour client\b'
  - 'contract[- ]to[- ](?:hire|perm)'
  - '\bC2H\b'
  - '(?:this is a|temporary) contract (?:position|role)'
  - 'W-?2 contract'
  - '\d+[- ]month contract'

# Wrong function: accounting, tax, audit, AP/AR, payroll, AML / financial crimes, insurance, credit / underwriting, commercial banking.
# Controller and wealth roles are not listed here.
wrong_function_title_patterns:
  - '\baccounting\b'
  - '\baccountant\b'
  - '\btax\b'
  - '\baudit(?:or)?\b'
  - 'accounts? (?:payable|receivable)'
  - '\bpayroll\b'
  - 'financial crimes?'
  - '\baml\b|anti[- ]money'
  - '\bkyc\b|know your customer'
  - '\binsurance\b'
  - 'credit analyst|credit risk|credit officer|credit underwrit|loan analyst|loan underwrit'
  - 'securitization|\bunderwrit'                       # underwriting of any kind
  - 'credit portfolio'                                 # credit reviews and limit monitoring (Citi "Credit Portfolio Analyst II", 2026-11-17)
  - 'commercial banking|commercial associate|relationship banking'   # client credit coverage (BofA "Commercial Associate", 2026-11-19)

# Moves backward: estimating, proposal pricing, cost/price analysis on government contracts, EVM / program control.
moves_backward_title_patterns:
  - '\bcost estimat'
  - '\bestimator\b|\bestimating\b'
  - 'proposal (?:pricing|analyst|cost)'
  - 'cost\s*/\s*price|price analyst|cost (?:and|&) pricing|pricing (?:and|&) estimating'
  - '\bevm\b|earned value|program control'
  - 'contracts? pricing|subcontract'
# A cost or pricing analyst title is also dropped when the JD is about government contracts.
moves_backward_cost_titles: ['cost analyst', 'pricing analyst', 'price analyst']
moves_backward_jd_patterns: ['\bFAR\b', 'DFARS', 'DCAA', 'government contract', 'cost accounting standards', 'earned value', 'proposal']

# Sales-like titles. Client service, advisor and relationship roles are sales, not finance analysis, even when the first words say "Asset Management".
sales_like_title_patterns:
  - 'client (?:service|services|advisor|adviser|associate|relationship|solutions?|executive)'
  - 'relationship (?:manager|associate|banker|officer|specialist|director)'
  - '(?:financial|wealth|investment|retirement|private) (?:advisor|adviser|consultant|planner)'
  - '\badvis[eo]r\b'
  - '\bsales\b|business development|account (?:executive|manager|director)|customer success'
  - '\bbanker\b|\bbroker\b|loan officer|\bteller\b|branch '
