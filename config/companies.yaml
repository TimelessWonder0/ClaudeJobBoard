# Company targets for the job board. Source: "Company and role targets" list from the user.
# Fields:
#   name         company name
#   category     group from the user's list
#   metros       target metros for this company
#   priority     1 (highest) to 3
#   careers_url  careers page, null when not yet known (filled by the resolve step)
#   ats_hint     the user's own note on the job board, verbatim
#   hint_status  confirmed | likely | verify | manual | own_provider (own_provider = career-ops has a dedicated provider)
#   sector_tier       future | adjacent | traditional  (the 10-point future-facing score; static, written from memory, no web lookups)
#   as_of, approx     date the sector_tier was written, and always true. Company size and market cap are not used for filtering or scoring.
#   scan_status       OK (scanned) | not scannable (manual) | off (not scanned: see note, e.g. defense, defunct, acquired)


roles:
  include:
    - Financial Analyst (I/II)
    - Finance Analyst
    - FP&A Analyst
    - Business / Product / Strategic / Corporate Finance Analyst
    - Finance Associate (tech companies)
    - Finance Rotational / Development Program
    - Pricing Analyst
    - Deal Desk Analyst
    - Revenue Analyst
    - Cost Analyst
    - Associate Equity Analyst
    - Equity Research Associate
    - Research Associate
    - Investment Analyst
  flag:
    - title: Senior Financial Analyst
      rule: keep only when the description asks for 3 years or less
    - title: Associate (at banks)
      rule: usually post-MBA with 3-5 years; the years filter decides, not the title

